name: Build EXE and APP

on:
  workflow_dispatch: {}      # 手动触发
  push:
    tags:
      - 'v*'                 # 打 tag 时自动触发

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pymupdf pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "PDF文字删除工具" delete_pdf_text_gui.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDF文字删除工具-Windows
          path: dist/PDF文字删除工具.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pymupdf pyinstaller

      - name: Build APP
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "PDF文字删除工具" delete_pdf_text_gui.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDF文字删除工具-Mac
          path: dist/PDF文字删除工具
