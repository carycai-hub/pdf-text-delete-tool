name: Build EXE and APP

on:
  workflow_dispatch: {}      # 手动触发
  push:
    tags:
      - 'v*'                 # 打 tag 时自动触发

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pymupdf pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "PDF文字删除工具" delete_pdf_text_gui.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDF文字删除工具-Windows
          path: dist/PDF文字删除工具.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pymupdf pyinstaller

      - name: Build APP
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "PDF文字删除工具" delete_pdf_text_gui.py
          # 给单文件可执行程序套一个标准 .app 壳，使其可双击运行
          APP="dist/PDF文字删除工具.app"
          mkdir -p "$APP/Contents/MacOS"
          cp dist/PDF文字删除工具 "$APP/Contents/MacOS/PDF文字删除工具"
          cat > "$APP/Contents/Info.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDisplayName</key>
            <string>PDF文字删除工具</string>
            <key>CFBundleExecutable</key>
            <string>PDF文字删除工具</string>
            <key>CFBundleIdentifier</key>
            <string>com.pdftextdeleter.tool</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>PDF文字删除工具</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          EOF
          # 临时 adhoc 签名，避免 Gatekeeper 拦截
          codesign --force --deep --sign - "$APP"
          rm -f dist/PDF文字删除工具

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDF文字删除工具-Mac
          path: dist/PDF文字删除工具.app
